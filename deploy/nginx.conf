# gutsengine.app on the Droplet: the games (/play/*, deploy/gateway.mjs) and the GUTS site (everything else).
# certbot adds the HTTPS server block to this file (certbot --nginx -d gutsengine.app -d www.gutsengine.app).
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name gutsengine.app www.gutsengine.app _;
    client_max_body_size 50m;

    gzip on;
    gzip_types application/javascript application/json text/css text/plain image/svg+xml model/gltf+json;
    gzip_min_length 1024;

    location /play {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }
}
