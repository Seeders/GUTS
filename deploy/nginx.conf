# gutsengine.app on the Droplet: the games (/play/*, deploy/gateway.mjs) and the GUTS site (everything else).
# HTTPS: certbot adds its listen 443 / certificate lines to this block on the server (deploy.sh setup re-runs
# certbot --nginx --reinstall after copying this file, so they come back). The certificate renews itself (certbot.timer).
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name gutsengine.app www.gutsengine.app _;
    client_max_body_size 50m;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types application/javascript text/javascript application/json text/css text/plain image/svg+xml model/gltf+json model/gltf-binary application/octet-stream;
    gzip_min_length 1024;

    # a game's assets and build straight from disk (pre-compressed .gz beside them, deploy.sh), cached a day;
    # its pages, API and socket go through the gateway (which starts the game)
    # a game's assets cached a day; its build always rechecked (a cheap 304), so a deploy reaches players at once
    location ~ ^/play/(age|kingdom|realm|heroarena|descent|wiki)/resources/(.+)$ {
        alias /srv/games/$1/resources/$2;
        gzip_static on;
        add_header Cache-Control "public, max-age=86400";
        types { model/gltf-binary glb; model/gltf+json gltf; application/json json; application/javascript js; image/png png; image/jpeg jpg; text/css css; audio/mpeg mp3; audio/ogg ogg; audio/wav wav; }
        default_type application/octet-stream;
    }
    location ~ ^/play/(age|kingdom|realm|heroarena|descent|wiki)/dist/(.+)$ {
        alias /srv/games/$1/dist/$2;
        gzip_static on;
        add_header Cache-Control "no-cache";
        types { model/gltf-binary glb; model/gltf+json gltf; application/json json; application/javascript js; image/png png; image/jpeg jpg; text/css css; audio/mpeg mp3; audio/ogg ogg; audio/wav wav; }
        default_type application/octet-stream;
    }

    location /play {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }
}
